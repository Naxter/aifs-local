# EXPERIMENTAL, UNTESTED — historical initial conditions from ERA5 via
# the Copernicus CDS API, to initialise AIFS on dates beyond open data's
# ~4-day window (storm case studies, etc.).
#
# Requires a free CDS account and ~/.cdsapirc with your API key:
#   https://cds.climate.copernicus.eu/how-to-api
# plus `pip install cdsapi` (without it this config fails with
# "ImportError: CDS access requires 'cdsapi' to be installed").
#
# Expect iteration once a key is available: ERA5 splits surface,
# pressure-level, wave and soil fields across CDS datasets, and fields
# arrive on a regular grid that must be regridded to N320 (the `regrid`
# pre-processor from anemoi-plugins-ecmwf-inference).

checkpoint:
  huggingface: ecmwf/aifs-single-2.0

lead_time: 24h

input:
  cds:
    dataset: reanalysis-era5-single-levels

allow_nans: true

output: printer
