[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "anemoi-inference-input-raw-plugin"
version = "0.1.0"
description = "Read initial states from raw-output .npz files for anemoi-inference"
readme = "README.md"
keywords = [ "meteorology" ]
license = { text = "MIT" }
authors = [
  { name = "Tobias Moers", email = "t.moers@gmx.net" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anemoi-inference>=0.8",
  "numpy",
]
urls.Homepage = "https://github.com/Naxter/aifs-local"
entry-points."anemoi.inference.inputs".raw = "anemoi_inference_input_raw_plugin.raw:RawInputPlugin"

[tool.setuptools]
packages = [ "anemoi_inference_input_raw_plugin" ]
include-package-data = true
zip-safe = true
